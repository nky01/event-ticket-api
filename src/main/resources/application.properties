spring.application.name=event-ticket-api

spring.datasource.url=jdbc:postgresql://localhost:5332/database?options=-c%20timezone=UTC
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:dev_secret_key_change_in_production_1234567890_super_secret}
jwt.expiration=${JWT_EXPIRATION:800000}